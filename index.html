<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MCCS Tela 🦍</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Servidor Global MQTT para Sinalização WebRTC -->
    <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #0a0a0a; }
        ::-webkit-scrollbar-thumb { background: #dc2626; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #b91c1c; }
    </style>
</head>
<body class="bg-black text-gray-200 h-screen flex flex-col overflow-hidden">

    <!-- TELA 1: LOGIN / IDENTIFICAÇÃO -->
    <div id="login-screen" class="fixed inset-0 bg-black/90 z-50 flex items-center justify-center p-4">
        <div class="bg-[#0a0a0a] w-full max-w-md p-8 rounded-2xl shadow-2xl border-2 border-red-600 relative overflow-hidden">
            <div class="absolute -top-10 -right-10 text-9xl opacity-5">🦍</div>

            <div class="text-center mb-6 relative z-10">
                <div class="inline-flex items-center justify-center w-16 h-16 rounded-2xl bg-red-600 text-white text-3xl mb-3 shadow-[0_0_15px_rgba(220,38,38,0.5)]">
                    🐒
                </div>
                <h1 class="text-2xl font-bold text-white uppercase tracking-wider">MCCS Tela</h1>
                <p class="text-sm text-red-400 mt-1">Transmissão P2P • O Bando tá on</p>
            </div>
            
            <div class="space-y-4 relative z-10">
                <div>
                    <label class="block text-xs font-bold uppercase text-gray-400 mb-2">Seu Nome de Primata</label>
                    <input type="text" id="username-input" placeholder="Ex: Babuíno Careca" 
                        class="w-full bg-[#111] border border-red-900/50 focus:border-red-500 rounded-lg p-3 text-white outline-none transition placeholder-gray-600">
                </div>
                
                <button id="login-btn" onclick="handleLoginAction()" class="w-full bg-red-600 hover:bg-red-700 text-white font-bold py-3 rounded-lg transition shadow-[0_0_10px_rgba(220,38,38,0.3)] hover:shadow-[0_0_20px_rgba(220,38,38,0.6)] flex items-center justify-center space-x-2 uppercase tracking-wide">
                    <i class="fa-solid fa-arrow-right-to-bracket" id="login-icon"></i>
                    <span id="login-btn-text">Entrar na Selva</span>
                </button>
            </div>
        </div>
    </div>

    <!-- TELA 2: SALA DE TRANSMISSÃO -->
    <div id="room-screen" class="hidden flex-1 flex h-full">
        <!-- Main Content (Vídeos) -->
        <div class="flex-1 flex flex-col bg-[#050505] relative">
            <!-- Topbar -->
            <div class="h-14 border-b border-red-900/40 px-4 flex items-center justify-between bg-black">
                <div class="flex items-center space-x-3">
                    <span class="text-xl">🦧</span>
                    <span id="room-title-display" class="font-bold text-red-500 tracking-wider uppercase">sala</span>
                    <button onclick="copyRoomLink()" class="bg-[#111] hover:bg-[#222] border border-red-900/30 text-gray-400 hover:text-red-400 text-xs px-2.5 py-1 rounded transition flex items-center space-x-1.5" title="Copiar link da sala">
                        <i class="fa-solid fa-link"></i>
                        <span>Copiar Link</span>
                    </button>
                    <span class="text-xs bg-red-900/20 text-red-400 border border-red-900/50 px-2 py-0.5 rounded-full" id="user-count-badge">1 primata online</span>
                </div>
                <div class="flex items-center space-x-2">
                    <button onclick="openSettings()" class="bg-[#111] hover:bg-[#222] border border-red-900/30 text-gray-300 px-3 py-1.5 rounded-lg text-sm font-medium transition flex items-center space-x-2">
                        <i class="fa-solid fa-gear"></i>
                        <span>Qualidade</span>
                    </button>
                    <button onclick="toggleShareScreen()" id="share-btn" class="bg-red-600 hover:bg-red-700 text-white px-4 py-1.5 rounded-lg text-sm font-bold uppercase tracking-wide transition flex items-center space-x-2 shadow-[0_0_10px_rgba(220,38,38,0.3)]">
                        <i class="fa-solid fa-desktop"></i>
                        <span id="share-btn-text">Transmitir Tela</span>
                    </button>
                    <button onclick="leaveRoom()" class="bg-[#111] hover:bg-red-900 text-gray-400 hover:text-white px-3 py-1.5 rounded-lg text-sm font-medium transition">
                        Sair
                    </button>
                </div>
            </div>

            <!-- Video Grid Area (Centralizado) -->
            <div class="flex-1 p-4 flex flex-wrap gap-4 items-center justify-center content-center bg-[#050505] overflow-y-auto" id="video-grid">
                <!-- Estado Vazio / Tela Inicial -->
                <div id="empty-state" class="flex flex-col items-center justify-center text-center text-gray-500 w-full">
                    <div class="w-24 h-24 rounded-full bg-red-900/10 border border-red-900/30 flex items-center justify-center text-5xl mb-4 text-red-600 shadow-[0_0_30px_rgba(220,38,38,0.1)]">
                        🙈
                    </div>
                    <p class="text-xl font-bold text-gray-300">Nenhum macaco transmitindo no momento</p>
                    <p class="text-sm mt-2 text-red-500/70">Clique em "Transmitir Tela" para compartilhar o seu monitor.</p>
                </div>
            </div>
        </div>

        <!-- Sidebar (Usuários na Sala) -->
        <div class="w-60 bg-[#0a0a0a] border-l border-red-900/40 flex flex-col">
            <div class="p-4 border-b border-red-900/40 bg-black">
                <h3 class="text-xs font-bold uppercase text-red-500 tracking-widest">No Bando — <span id="sidebar-count">1</span></h3>
            </div>
            <div id="users-list" class="p-2 space-y-1 overflow-y-auto flex-1">
                <!-- Lista injetada via JS -->
            </div>
        </div>
    </div>

    <!-- MODAL DE CONFIGURAÇÕES DE VÍDEO -->
    <div id="settings-modal" class="hidden fixed inset-0 bg-black/80 z-50 flex items-center justify-center p-4 backdrop-blur-sm">
        <div class="bg-[#0a0a0a] w-full max-w-sm rounded-2xl p-6 border border-red-600 shadow-[0_0_20px_rgba(220,38,38,0.2)]">
            <h3 class="text-lg font-bold text-white mb-4 uppercase tracking-wide">Configurações 🦍</h3>
            
            <div class="space-y-4">
                <div>
                    <label class="block text-xs font-bold uppercase text-gray-400 mb-2">Resolução</label>
                    <select id="setting-resolution" class="w-full bg-[#111] border border-red-900/50 focus:border-red-500 rounded-lg p-2.5 text-white outline-none">
                        <option value="1080">1080p (Full HD)</option>
                        <option value="720" selected>720p (HD)</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-bold uppercase text-gray-400 mb-2">Taxa de Quadros (FPS)</label>
                    <select id="setting-fps" class="w-full bg-[#111] border border-red-900/50 focus:border-red-500 rounded-lg p-2.5 text-white outline-none">
                        <option value="60" selected>60 FPS (Fluido)</option>
                        <option value="30">30 FPS (Leve)</option>
                    </select>
                </div>
            </div>

            <div class="mt-6 flex justify-end space-x-2">
                <button onclick="closeSettings()" class="bg-[#111] hover:bg-red-900 border border-red-900/30 text-white px-5 py-2 rounded-lg text-sm font-bold uppercase transition">Fechar</button>
            </div>
        </div>
    </div>

    <script>
        let currentUser = '';
        let currentRoom = '';
        let localStream = null;
        let isSharing = false;
        
        const brokerUrl = 'wss://broker.emqx.io:8084/mqtt';
        let mqttClient = null;
        let myId = 'usr_' + Math.random().toString(36).substr(2, 9);
        let peers = {}; 

        // Lista de nomes de macacos para o sorteio
        const monkeyNames = [
            'Babuíno', 'Gorila', 'Chimpanzé', 'Orangotango', 'Macaco Prego', 
            'Sagui', 'Bugio', 'Macaco-aranha', 'Mico-leão', 'Mandril'
        ];

        window.addEventListener('DOMContentLoaded', () => {
            const savedName = localStorage.getItem('mccs_username');
            if (savedName) {
                document.getElementById('username-input').value = savedName;
            } else {
                // Sorteia um nome de macaco aleatório
                const randomMonkey = monkeyNames[Math.floor(Math.random() * monkeyNames.length)];
                document.getElementById('username-input').value = randomMonkey;
            }

            const hash = window.location.hash.replace('#', '');
            if (hash) {
                document.getElementById('login-btn-text').innerText = 'Entrar na Sala';
                document.getElementById('login-icon').className = 'fa-solid fa-arrow-right-to-bracket';
            }
        });

        function generateRandomRoom() {
            const chars = 'abcdefghijklmnopqrstuvwxyz0123456789';
            let result = '';
            for (let i = 0; i < 6; i++) {
                result += chars.charAt(Math.floor(Math.random() * chars.length));
            }
            return 'mccs-' + result;
        }

        function handleLoginAction() {
            const username = document.getElementById('username-input').value.trim();
            if (!username) {
                alert('Por favor, insira o seu nome de primata.');
                return;
            }

            const btn = document.getElementById('login-btn');
            btn.disabled = true;
            document.getElementById('login-btn-text').innerText = 'Conectando...';

            localStorage.setItem('mccs_username', username);
            currentUser = username;

            let hash = window.location.hash.replace('#', '');
            if (!hash) {
                hash = generateRandomRoom();
                window.location.hash = hash;
            }
            currentRoom = hash;

            initSignaling();
        }

        function initSignaling() {
            mqttClient = mqtt.connect(brokerUrl);

            mqttClient.on('connect', () => {
                const baseTopic = `mccstela/${currentRoom}`;
                
                mqttClient.subscribe(`${baseTopic}/#`);
                mqttClient.publish(`${baseTopic}/join`, JSON.stringify({ id: myId, name: currentUser }));

                window.addEventListener('beforeunload', () => {
                    mqttClient.publish(`${baseTopic}/leave`, JSON.stringify({ id: myId }));
                });

                enterRoomUI();
            });

            mqttClient.on('error', (err) => {
                alert("Rede bloqueada. Tente usar outra internet.");
                location.reload();
            });

            mqttClient.on('message', (topic, message) => {
                const msg = JSON.parse(message.toString());
                const baseTopic = `mccstela/${currentRoom}`;

                if (topic === `${baseTopic}/join` && msg.id !== myId) {
                    createPeer(msg.id, msg.name, true);
                    mqttClient.publish(`${baseTopic}/here`, JSON.stringify({ 
                        id: myId, name: currentUser, target: msg.id 
                    }));
                }

                if (topic === `${baseTopic}/here` && msg.target === myId) {
                    createPeer(msg.id, msg.name, false);
                }

                if (topic === `${baseTopic}/signal/${myId}`) {
                    handleSignal(msg.from, msg.name, msg.signal);
                }

                if (topic === `${baseTopic}/leave` && msg.id !== myId) {
                    removePeer(msg.id);
                }
            });
        }

        function createPeer(peerId, peerName, isInitiator) {
            if (peers[peerId]) return peers[peerId];

            const pc = new RTCPeerConnection({
                iceServers: [
                    { urls: 'stun:stun.l.google.com:19302' },
                    { urls: 'stun:stun1.l.google.com:19302' }
                ]
            });

            peers[peerId] = { pc, name: peerName, senders: [] };

            if (isSharing && localStream) {
                localStream.getTracks().forEach(track => {
                    const sender = pc.addTrack(track, localStream);
                    peers[peerId].senders.push(sender);
                });
            }

            pc.onicecandidate = (e) => {
                if (e.candidate) {
                    sendSignal(peerId, { type: 'candidate', candidate: e.candidate });
                }
            };

            pc.ontrack = (e) => {
                if (e.streams && e.streams[0]) {
                    addVideoStream(peerId, e.streams[0], peerName, false);
                }
            };

            pc.oniceconnectionstatechange = () => {
                if (pc.iceConnectionState === 'disconnected' || pc.iceConnectionState === 'failed') {
                    removePeer(peerId);
                }
            };

            let isNegotiating = false;
            pc.onnegotiationneeded = async () => {
                if (isNegotiating) return;
                isNegotiating = true;
                try {
                    const offer = await pc.createOffer();
                    await pc.setLocalDescription(offer);
                    sendSignal(peerId, offer);
                } catch (err) {} finally {
                    isNegotiating = false;
                }
            };

            pc.onsignalingstatechange = () => {
                isNegotiating = (pc.signalingState !== "stable");
            };

            if (isInitiator) {
                pc.createDataChannel('mccs-init-channel');
            }

            updateUsersList();
            return peers[peerId];
        }

        function sendSignal(targetId, signal) {
            mqttClient.publish(`mccstela/${currentRoom}/signal/${targetId}`, JSON.stringify({
                from: myId,
                name: currentUser,
                signal: signal
            }));
        }

        async function handleSignal(fromId, name, signal) {
            let peer = peers[fromId];
            if (!peer) {
                peer = createPeer(fromId, name, false);
            }

            const pc = peer.pc;
            try {
                if (signal.type === 'offer') {
                    await pc.setRemoteDescription(new RTCSessionDescription(signal));
                    const answer = await pc.createAnswer();
                    await pc.setLocalDescription(answer);
                    sendSignal(fromId, answer);
                } else if (signal.type === 'answer') {
                    await pc.setRemoteDescription(new RTCSessionDescription(signal));
                } else if (signal.type === 'candidate') {
                    await pc.addIceCandidate(new RTCIceCandidate(signal.candidate));
                }
            } catch (err) {}
        }

        function removePeer(id) {
            if (peers[id]) {
                peers[id].pc.close();
                delete peers[id];
            }
            removeVideoStream(id);
            updateUsersList();
        }

        function enterRoomUI() {
            document.getElementById('room-title-display').innerText = currentRoom;
            document.getElementById('login-screen').classList.add('hidden');
            document.getElementById('room-screen').classList.remove('hidden');
            updateUsersList();
        }

        function leaveRoom() {
            if (localStream) {
                localStream.getTracks().forEach(track => track.stop());
            }
            if (mqttClient) {
                mqttClient.publish(`mccstela/${currentRoom}/leave`, JSON.stringify({ id: myId }));
                mqttClient.end();
            }
            window.location.hash = '';
            location.reload();
        }

        function copyRoomLink() {
            navigator.clipboard.writeText(window.location.href);
            alert('Link da sala copiado! Chame os outros macacos.');
        }

        function updateUsersList() {
            const listEl = document.getElementById('users-list');
            const ids = Object.keys(peers);
            const total = ids.length + 1; 

            document.getElementById('sidebar-count').innerText = total;
            document.getElementById('user-count-badge').innerText = `${total} primata(s) online`;
            
            let html = `
                <div class="flex items-center space-x-2 px-2 py-1.5 rounded hover:bg-[#111] transition border border-transparent hover:border-red-900/30">
                    <div class="w-8 h-8 rounded-full bg-red-600 flex items-center justify-center font-bold text-white text-sm shadow-lg">
                        ${currentUser.charAt(0).toUpperCase()}
                    </div>
                    <span class="text-sm font-bold text-white truncate">${currentUser} (Você)</span>
                </div>
            `;

            ids.forEach(id => {
                const name = peers[id].name || 'Macaco';
                html += `
                    <div class="flex items-center space-x-2 px-2 py-1.5 rounded hover:bg-[#111] transition border border-transparent hover:border-red-900/30">
                        <div class="w-8 h-8 rounded-full bg-[#222] border border-red-900 flex items-center justify-center font-bold text-red-500 text-sm">
                            ${name.charAt(0).toUpperCase()}
                        </div>
                        <span class="text-sm font-medium text-gray-300 truncate">${name}</span>
                    </div>
                `;
            });

            listEl.innerHTML = html;
        }

        function openSettings() {
            document.getElementById('settings-modal').classList.remove('hidden');
        }

        function closeSettings() {
            document.getElementById('settings-modal').classList.add('hidden');
        }

        function toggleFullScreen(containerId) {
            const container = document.getElementById(containerId);
            if (!container) return;

            if (!document.fullscreenElement) {
                if (container.requestFullscreen) {
                    container.requestFullscreen();
                } else if (container.webkitRequestFullscreen) {
                    container.webkitRequestFullscreen();
                } else if (container.msRequestFullscreen) {
                    container.msRequestFullscreen();
                }
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                }
            }
        }

        async function toggleShareScreen() {
            const shareBtn = document.getElementById('share-btn');
            const shareBtnText = document.getElementById('share-btn-text');

            if (!isSharing) {
                try {
                    const resolution = document.getElementById('setting-resolution').value;
                    const fps = parseInt(document.getElementById('setting-fps').value);

                    const constraints = {
                        video: {
                            width: { ideal: resolution === '1080' ? 1920 : 1280 },
                            height: { ideal: resolution === '1080' ? 1080 : 720 },
                            frameRate: { ideal: fps }
                        },
                        audio: true
                    };

                    localStream = await navigator.mediaDevices.getDisplayMedia(constraints);
                    isSharing = true;

                    shareBtn.classList.remove('bg-red-600', 'hover:bg-red-700');
                    shareBtn.classList.add('bg-[#111]', 'hover:bg-red-900', 'border', 'border-red-600');
                    shareBtnText.innerText = 'Parar Transmissão';

                    Object.values(peers).forEach(peer => {
                        localStream.getTracks().forEach(track => {
                            const sender = peer.pc.addTrack(track, localStream);
                            peer.senders.push(sender);
                        });
                    });

                    // Para mim (isLocal = true), a tela é adicionada e o vídeo carrega direto
                    addVideoStream('self', localStream, currentUser + ' (Você)', true);

                    localStream.getVideoTracks()[0].onended = () => {
                        stopSharing();
                    };

                } catch (err) {}
            } else {
                stopSharing();
            }
        }

        function stopSharing() {
            if (localStream) {
                localStream.getTracks().forEach(track => track.stop());
                localStream = null;
            }
            isSharing = false;

            const shareBtn = document.getElementById('share-btn');
            shareBtn.classList.remove('bg-[#111]', 'hover:bg-red-900', 'border', 'border-red-600');
            shareBtn.classList.add('bg-red-600', 'hover:bg-red-700');
            document.getElementById('share-btn-text').innerText = 'Transmitir Tela';

            Object.values(peers).forEach(peer => {
                peer.senders.forEach(sender => {
                    try { peer.pc.removeTrack(sender); } catch(e) {}
                });
                peer.senders = [];
            });

            removeVideoStream('self');
        }

        function addVideoStream(id, stream, name, isLocal = false) {
            document.getElementById('empty-state').classList.add('hidden');
            const grid = document.getElementById('video-grid');

            removeVideoStream(id);
            if (!stream || stream.getTracks().length === 0) return;

            const containerId = `video-container-${id}`;
            const container = document.createElement('div');
            // Largura e altura maximizadas para ficar no centro
            container.id = containerId;
            container.className = 'group relative bg-black rounded-xl overflow-hidden shadow-[0_0_15px_rgba(220,38,38,0.15)] border border-red-900/40 aspect-video flex items-center justify-center w-full max-w-5xl transition-all duration-300';

            const video = document.createElement('video');
            video.playsInline = true;
            video.className = 'w-full h-full object-contain';
            
            // Controle de Overlay para clicar em assistir se for outro usuário
            if (isLocal) {
                video.muted = true;
                video.srcObject = stream;
                video.autoplay = true;
            } else {
                // Tela de aceitação (Opt-in)
                const watchOverlay = document.createElement('div');
                watchOverlay.className = 'absolute inset-0 bg-black/90 flex flex-col items-center justify-center z-20 backdrop-blur-sm transition-opacity duration-300';
                watchOverlay.innerHTML = `
                    <div class="text-6xl mb-4 animate-pulse">🦍</div>
                    <p class="text-xl text-white font-bold mb-6 text-center px-4">Transmissão de <span class="text-red-500">${name}</span></p>
                    <button class="bg-red-600 hover:bg-red-700 text-white font-bold py-3 px-8 rounded-lg transition shadow-[0_0_20px_rgba(220,38,38,0.4)] flex items-center space-x-2">
                        <i class="fa-solid fa-play"></i>
                        <span>Assistir Tela</span>
                    </button>
                `;
                
                const playBtn = watchOverlay.querySelector('button');
                playBtn.onclick = () => {
                    video.srcObject = stream;
                    video.play();
                    watchOverlay.style.opacity = '0';
                    setTimeout(() => watchOverlay.remove(), 300);
                };
                
                container.appendChild(watchOverlay);
            }

            const label = document.createElement('div');
            label.className = 'absolute bottom-3 left-3 right-3 flex justify-between items-center bg-black/80 border border-red-900/50 backdrop-blur-md px-4 py-2 rounded-lg text-xs font-medium text-white opacity-100 md:opacity-0 group-hover:opacity-100 transition-opacity duration-300 z-10';
            
            label.innerHTML = `
                <div class="flex items-center space-x-2">
                    <i class="fa-solid fa-desktop text-red-500"></i>
                    <span class="font-bold tracking-wide">${name}</span>
                </div>
                <button onclick="toggleFullScreen('${containerId}')" class="bg-red-600 hover:bg-red-500 text-white w-8 h-8 rounded flex items-center justify-center transition shadow-[0_0_10px_rgba(220,38,38,0.4)]" title="Tela Cheia">
                    <i class="fa-solid fa-expand"></i>
                </button>
            `;

            container.appendChild(video);
            container.appendChild(label);
            grid.appendChild(container);
        }

        function removeVideoStream(id) {
            const container = document.getElementById(`video-container-${id}`);
            if (container) {
                container.remove();
            }
            const grid = document.getElementById('video-grid');
            if (grid.children.length <= 1) { // Só tem o empty-state
                document.getElementById('empty-state').classList.remove('hidden');
            }
        }
    </script>
</body>
</html>
