<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MCCS Tela</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Servidor Global MQTT para Sinalização WebRTC super estável -->
    <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
    </style>
</head>
<body class="bg-[#313338] text-[#dbdee1] h-screen flex flex-col overflow-hidden">

    <!-- TELA 1: LOGIN / IDENTIFICAÇÃO -->
    <div id="login-screen" class="fixed inset-0 bg-[#1e1f22] z-50 flex items-center justify-center p-4">
        <div class="bg-[#313338] w-full max-w-md p-8 rounded-2xl shadow-2xl border border-[#232428]">
            <div class="text-center mb-6">
                <div class="inline-flex items-center justify-center w-16 h-16 rounded-2xl bg-[#5865F2] text-white text-2xl font-bold mb-3 shadow-lg">
                    <i class="fa-solid fa-display"></i>
                </div>
                <h1 class="text-2xl font-bold text-white">MCCS Tela</h1>
                <p class="text-sm text-[#949ba4] mt-1">Transmissão de tela rápida e privada</p>
            </div>
            
            <div class="space-y-4">
                <div>
                    <label class="block text-xs font-bold uppercase text-[#949ba4] mb-2">Seu Nome / Apelido</label>
                    <input type="text" id="username-input" value="Teus" placeholder="Ex: Teus" 
                        class="w-full bg-[#1e1f22] border border-transparent focus:border-[#5865F2] rounded-lg p-3 text-white outline-none transition">
                </div>
                
                <button id="login-btn" onclick="handleLoginAction()" class="w-full bg-[#5865F2] hover:bg-[#4752c4] text-white font-medium py-3 rounded-lg transition shadow-md flex items-center justify-center space-x-2">
                    <i class="fa-solid fa-arrow-right-to-bracket" id="login-icon"></i>
                    <span id="login-btn-text">Criar Nova Tela</span>
                </button>
            </div>
        </div>
    </div>

    <!-- TELA 2: SALA DE TRANSMISSÃO -->
    <div id="room-screen" class="hidden flex-1 flex h-full">
        <!-- Main Content (Vídeos) -->
        <div class="flex-1 flex flex-col bg-[#313338] relative">
            <!-- Topbar -->
            <div class="h-14 border-b border-[#232428] px-4 flex items-center justify-between bg-[#313338]">
                <div class="flex items-center space-x-3">
                    <i class="fa-solid fa-hashtag text-[#80848e] text-xl"></i>
                    <span id="room-title-display" class="font-bold text-white">sala</span>
                    <button onclick="copyRoomLink()" class="bg-[#2b2d31] hover:bg-[#35373c] text-[#949ba4] hover:text-white text-xs px-2.5 py-1 rounded transition flex items-center space-x-1.5" title="Copiar link da sala">
                        <i class="fa-solid fa-copy"></i>
                        <span>Copiar Link</span>
                    </button>
                    <span class="text-xs bg-[#2b2d31] text-[#949ba4] px-2 py-0.5 rounded-full" id="user-count-badge">1 online</span>
                </div>
                <div class="flex items-center space-x-2">
                    <button onclick="openSettings()" class="bg-[#2b2d31] hover:bg-[#35373c] text-white px-3 py-1.5 rounded-lg text-sm font-medium transition flex items-center space-x-2">
                        <i class="fa-solid fa-gear"></i>
                        <span>Qualidade</span>
                    </button>
                    <button onclick="toggleShareScreen()" id="share-btn" class="bg-[#248046] hover:bg-[#1a6335] text-white px-4 py-1.5 rounded-lg text-sm font-medium transition flex items-center space-x-2">
                        <i class="fa-solid fa-share-from-square"></i>
                        <span id="share-btn-text">Transmitir Tela</span>
                    </button>
                    <button onclick="leaveRoom()" class="bg-[#da373c] hover:bg-[#a1282c] text-white px-3 py-1.5 rounded-lg text-sm font-medium transition">
                        Sair
                    </button>
                </div>
            </div>

            <!-- Video Grid Area -->
            <div class="flex-1 p-4 grid grid-cols-1 md:grid-cols-2 gap-4 overflow-y-auto items-center justify-center bg-[#1e1f22]" id="video-grid">
                <!-- Estado Vazio / Tela Inicial -->
                <div id="empty-state" class="col-span-full flex flex-col items-center justify-center text-center text-[#949ba4]">
                    <div class="w-20 h-20 rounded-full bg-[#2b2d31] flex items-center justify-center text-3xl mb-4 text-[#dbdee1]">
                        <i class="fa-solid fa-video-slash"></i>
                    </div>
                    <p class="text-lg font-medium text-white">Nenhuma transmissão ativa no momento</p>
                    <p class="text-sm mt-1">Clique em "Transmitir Tela" acima para começar a compartilhar.</p>
                </div>
            </div>
        </div>

        <!-- Sidebar (Usuários na Sala) -->
        <div class="w-60 bg-[#2b2d31] border-l border-[#232428] flex flex-col">
            <div class="p-4 border-b border-[#232428]">
                <h3 class="text-xs font-bold uppercase text-[#949ba4] tracking-wider">Na Sala — <span id="sidebar-count">1</span></h3>
            </div>
            <div id="users-list" class="p-2 space-y-1 overflow-y-auto flex-1">
                <!-- Lista injetada via JS -->
            </div>
        </div>
    </div>

    <!-- MODAL DE CONFIGURAÇÕES DE VÍDEO -->
    <div id="settings-modal" class="hidden fixed inset-0 bg-black/60 z-50 flex items-center justify-center p-4">
        <div class="bg-[#313338] w-full max-w-sm rounded-2xl p-6 border border-[#232428] shadow-2xl">
            <h3 class="text-lg font-bold text-white mb-4">Configurações de Transmissão</h3>
            
            <div class="space-y-4">
                <div>
                    <label class="block text-xs font-bold uppercase text-[#949ba4] mb-2">Resolução</label>
                    <select id="setting-resolution" class="w-full bg-[#1e1f22] border border-transparent focus:border-[#5865F2] rounded-lg p-2.5 text-white outline-none">
                        <option value="1080">1080p (Full HD)</option>
                        <option value="720" selected>720p (HD)</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-bold uppercase text-[#949ba4] mb-2">Taxa de Quadros (FPS)</label>
                    <select id="setting-fps" class="w-full bg-[#1e1f22] border border-transparent focus:border-[#5865F2] rounded-lg p-2.5 text-white outline-none">
                        <option value="60" selected>60 FPS (Fluido)</option>
                        <option value="30">30 FPS (Leve)</option>
                    </select>
                </div>
            </div>

            <div class="mt-6 flex justify-end space-x-2">
                <button onclick="closeSettings()" class="bg-[#4e5058] hover:bg-[#6d6f78] text-white px-4 py-2 rounded-lg text-sm transition">Fechar</button>
            </div>
        </div>
    </div>

    <!-- WebRTC Master Script com MQTT via WSS -->
    <script>
        let currentUser = '';
        let currentRoom = '';
        let localStream = null;
        let isSharing = false;
        
        // MQTT broker público estável (WebSockets sobre SSL)
        const brokerUrl = 'wss://broker.emqx.io:8084/mqtt';
        let mqttClient = null;
        let myId = 'usr_' + Math.random().toString(36).substr(2, 9);
        let peers = {}; // Guarda as conexões de vídeo com cada utilizador

        window.addEventListener('DOMContentLoaded', () => {
            const savedName = localStorage.getItem('mccs_username');
            if (savedName) {
                document.getElementById('username-input').value = savedName;
            }

            const hash = window.location.hash.replace('#', '');
            if (hash) {
                document.getElementById('login-btn-text').innerText = 'Entrar na Sala';
                document.getElementById('login-icon').className = 'fa-solid fa-arrow-right-to-bracket';
            }
        });

        function generateRandomRoom() {
            const chars = 'abcdefghijklmnopqrstuvwxyz0123456789';
            let result = '';
            for (let i = 0; i < 6; i++) {
                result += chars.charAt(Math.floor(Math.random() * chars.length));
            }
            return 'mccs-' + result;
        }

        function handleLoginAction() {
            const username = document.getElementById('username-input').value.trim();
            if (!username) {
                alert('Por favor, insira o seu nome.');
                return;
            }

            const btn = document.getElementById('login-btn');
            btn.disabled = true;
            document.getElementById('login-btn-text').innerText = 'Conectando aos servidores...';

            localStorage.setItem('mccs_username', username);
            currentUser = username;

            let hash = window.location.hash.replace('#', '');
            if (!hash) {
                hash = generateRandomRoom();
                window.location.hash = hash;
            }
            currentRoom = hash;

            initSignaling();
        }

        function initSignaling() {
            // Conecta ao canal global
            mqttClient = mqtt.connect(brokerUrl);

            mqttClient.on('connect', () => {
                console.log('Sinalização Online!');
                const baseTopic = `mccstela/${currentRoom}`;
                
                // Subscreve à sala
                mqttClient.subscribe(`${baseTopic}/#`);

                // Avisa todos que entramos
                mqttClient.publish(`${baseTopic}/join`, JSON.stringify({ id: myId, name: currentUser }));

                // Prepara o adeus caso a aba seja fechada
                window.addEventListener('beforeunload', () => {
                    mqttClient.publish(`${baseTopic}/leave`, JSON.stringify({ id: myId }));
                });

                enterRoomUI();
            });

            mqttClient.on('error', (err) => {
                console.error("Erro no MQTT:", err);
                alert("Rede bloqueada. Tente usar outra internet ou desligar o Adblock.");
                location.reload();
            });

            mqttClient.on('message', (topic, message) => {
                const msg = JSON.parse(message.toString());
                const baseTopic = `mccstela/${currentRoom}`;

                // 1. Alguém novo entrou na sala
                if (topic === `${baseTopic}/join` && msg.id !== myId) {
                    console.log('Novo usuário:', msg.name);
                    createPeer(msg.id, msg.name, true);
                    
                    // Respondemos para ele saber que já estamos aqui
                    mqttClient.publish(`${baseTopic}/here`, JSON.stringify({ 
                        id: myId, name: currentUser, target: msg.id 
                    }));
                }

                // 2. Recebemos resposta de alguém que já estava na sala
                if (topic === `${baseTopic}/here` && msg.target === myId) {
                    console.log('Usuário já estava na sala:', msg.name);
                    createPeer(msg.id, msg.name, false);
                }

                // 3. Comunicação direta WebRTC
                if (topic === `${baseTopic}/signal/${myId}`) {
                    handleSignal(msg.from, msg.name, msg.signal);
                }

                // 4. Alguém saiu
                if (topic === `${baseTopic}/leave` && msg.id !== myId) {
                    removePeer(msg.id);
                }
            });
        }

        function createPeer(peerId, peerName, isInitiator) {
            if (peers[peerId]) return peers[peerId];

            const pc = new RTCPeerConnection({
                iceServers: [
                    { urls: 'stun:stun.l.google.com:19302' },
                    { urls: 'stun:stun1.l.google.com:19302' }
                ]
            });

            peers[peerId] = { pc, name: peerName, senders: [] };

            // Se eu já estiver compartilhando a tela, injeta no novo amigo
            if (isSharing && localStream) {
                localStream.getTracks().forEach(track => {
                    const sender = pc.addTrack(track, localStream);
                    peers[peerId].senders.push(sender);
                });
            }

            // Descobre caminhos de rede
            pc.onicecandidate = (e) => {
                if (e.candidate) {
                    sendSignal(peerId, { type: 'candidate', candidate: e.candidate });
                }
            };

            // Recebe o vídeo do amigo
            pc.ontrack = (e) => {
                if (e.streams && e.streams[0]) {
                    addVideoStream(peerId, e.streams[0], peerName, false);
                }
            };

            // Trata falhas de conexão
            pc.oniceconnectionstatechange = () => {
                if (pc.iceConnectionState === 'disconnected' || pc.iceConnectionState === 'failed') {
                    removePeer(peerId);
                }
            };

            // Faz a negociação automática sempre que as faixas de vídeo mudam
            let isNegotiating = false;
            pc.onnegotiationneeded = async () => {
                if (isNegotiating) return;
                isNegotiating = true;
                try {
                    const offer = await pc.createOffer();
                    await pc.setLocalDescription(offer);
                    sendSignal(peerId, offer);
                } catch (err) {
                    console.error("Erro na negociação:", err);
                } finally {
                    isNegotiating = false;
                }
            };

            pc.onsignalingstatechange = () => {
                isNegotiating = (pc.signalingState !== "stable");
            };

            // Se eu criei a conexão (novo visitante), eu forço um canal de dados para iniciar
            if (isInitiator) {
                pc.createDataChannel('mccs-init-channel');
            }

            updateUsersList();
            return peers[peerId];
        }

        function sendSignal(targetId, signal) {
            mqttClient.publish(`mccstela/${currentRoom}/signal/${targetId}`, JSON.stringify({
                from: myId,
                name: currentUser,
                signal: signal
            }));
        }

        async function handleSignal(fromId, name, signal) {
            let peer = peers[fromId];
            if (!peer) {
                peer = createPeer(fromId, name, false);
            }

            const pc = peer.pc;

            try {
                if (signal.type === 'offer') {
                    await pc.setRemoteDescription(new RTCSessionDescription(signal));
                    const answer = await pc.createAnswer();
                    await pc.setLocalDescription(answer);
                    sendSignal(fromId, answer);
                } else if (signal.type === 'answer') {
                    await pc.setRemoteDescription(new RTCSessionDescription(signal));
                } else if (signal.type === 'candidate') {
                    await pc.addIceCandidate(new RTCIceCandidate(signal.candidate));
                }
            } catch (err) {
                console.error('Erro ao processar o sinal WebRTC:', err);
            }
        }

        function removePeer(id) {
            if (peers[id]) {
                peers[id].pc.close();
                delete peers[id];
            }
            removeVideoStream(id);
            updateUsersList();
        }

        function enterRoomUI() {
            document.getElementById('room-title-display').innerText = currentRoom;
            document.getElementById('login-screen').classList.add('hidden');
            document.getElementById('room-screen').classList.remove('hidden');
            updateUsersList();
        }

        function leaveRoom() {
            if (localStream) {
                localStream.getTracks().forEach(track => track.stop());
            }
            if (mqttClient) {
                mqttClient.publish(`mccstela/${currentRoom}/leave`, JSON.stringify({ id: myId }));
                mqttClient.end();
            }
            window.location.hash = '';
            location.reload();
        }

        function copyRoomLink() {
            navigator.clipboard.writeText(window.location.href);
            alert('Link da sala copiado! Mande para os seus amigos.');
        }

        function updateUsersList() {
            const listEl = document.getElementById('users-list');
            const ids = Object.keys(peers);
            const total = ids.length + 1; // +1 Você

            document.getElementById('sidebar-count').innerText = total;
            document.getElementById('user-count-badge').innerText = `${total} online`;
            
            let html = `
                <div class="flex items-center space-x-2 px-2 py-1.5 rounded hover:bg-[#35373c] transition">
                    <div class="w-8 h-8 rounded-full bg-[#5865F2] flex items-center justify-center font-bold text-white text-sm">
                        ${currentUser.charAt(0).toUpperCase()}
                    </div>
                    <span class="text-sm font-medium text-white truncate">${currentUser} (Você)</span>
                </div>
            `;

            ids.forEach(id => {
                const name = peers[id].name || 'Convidado';
                html += `
                    <div class="flex items-center space-x-2 px-2 py-1.5 rounded hover:bg-[#35373c] transition">
                        <div class="w-8 h-8 rounded-full bg-[#5865F2] flex items-center justify-center font-bold text-white text-sm">
                            ${name.charAt(0).toUpperCase()}
                        </div>
                        <span class="text-sm font-medium text-white truncate">${name}</span>
                    </div>
                `;
            });

            listEl.innerHTML = html;
        }

        function openSettings() {
            document.getElementById('settings-modal').classList.remove('hidden');
        }

        function closeSettings() {
            document.getElementById('settings-modal').classList.add('hidden');
        }

        async function toggleShareScreen() {
            const shareBtn = document.getElementById('share-btn');
            const shareBtnText = document.getElementById('share-btn-text');

            if (!isSharing) {
                try {
                    const resolution = document.getElementById('setting-resolution').value;
                    const fps = parseInt(document.getElementById('setting-fps').value);

                    const constraints = {
                        video: {
                            width: { ideal: resolution === '1080' ? 1920 : 1280 },
                            height: { ideal: resolution === '1080' ? 1080 : 720 },
                            frameRate: { ideal: fps }
                        },
                        audio: true
                    };

                    localStream = await navigator.mediaDevices.getDisplayMedia(constraints);
                    isSharing = true;

                    shareBtn.classList.remove('bg-[#248046]', 'hover:bg-[#1a6335]');
                    shareBtn.classList.add('bg-[#da373c]', 'hover:bg-[#a1282c]');
                    shareBtnText.innerText = 'Parar Transmissão';

                    // Envia a tela para todos que já estão conectados
                    Object.values(peers).forEach(peer => {
                        localStream.getTracks().forEach(track => {
                            const sender = peer.pc.addTrack(track, localStream);
                            peer.senders.push(sender);
                        });
                    });

                    addVideoStream('self', localStream, currentUser + ' (Você)', true);

                    localStream.getVideoTracks()[0].onended = () => {
                        stopSharing();
                    };

                } catch (err) {
                    console.error("Erro ao capturar tela:", err);
                }
            } else {
                stopSharing();
            }
        }

        function stopSharing() {
            if (localStream) {
                localStream.getTracks().forEach(track => track.stop());
                localStream = null;
            }
            isSharing = false;

            const shareBtn = document.getElementById('share-btn');
            shareBtn.classList.remove('bg-[#da373c]', 'hover:bg-[#a1282c]');
            shareBtn.classList.add('bg-[#248046]', 'hover:bg-[#1a6335]');
            document.getElementById('share-btn-text').innerText = 'Transmitir Tela';

            // Remove o stream das conexões existentes
            Object.values(peers).forEach(peer => {
                peer.senders.forEach(sender => {
                    try { peer.pc.removeTrack(sender); } catch(e) {}
                });
                peer.senders = [];
            });

            removeVideoStream('self');
        }

        function addVideoStream(id, stream, name, isLocal = false) {
            document.getElementById('empty-state').classList.add('hidden');
            const grid = document.getElementById('video-grid');

            removeVideoStream(id);

            // Não desenha streams vazios
            if (!stream || stream.getTracks().length === 0) return;

            const container = document.createElement('div');
            container.id = `video-container-${id}`;
            container.className = 'relative bg-[#111214] rounded-xl overflow-hidden shadow-lg border border-[#232428] aspect-video flex items-center justify-center';

            const video = document.createElement('video');
            video.srcObject = stream;
            video.autoplay = true;
            video.playsInline = true;
            if (isLocal) video.muted = true;
            video.className = 'w-full h-full object-contain';

            const label = document.createElement('div');
            label.className = 'absolute bottom-3 left-3 bg-black/60 backdrop-blur-md px-3 py-1 rounded-lg text-xs font-medium text-white flex items-center space-x-2';
            label.innerHTML = `<i class="fa-solid fa-display text-[#5865F2]"></i><span>Tela de ${name}</span>`;

            container.appendChild(video);
            container.appendChild(label);
            grid.appendChild(container);
        }

        function removeVideoStream(id) {
            const container = document.getElementById(`video-container-${id}`);
            if (container) {
                container.remove();
            }
            const grid = document.getElementById('video-grid');
            if (grid.children.length <= 1) {
                document.getElementById('empty-state').classList.remove('hidden');
            }
        }
    </script>
</body>
</html>
